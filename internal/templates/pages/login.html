{{define "content"}}
<section class="login-card">
  <div class="login-brand"><span class="brand-mark large">{{icon "mark"}}</span><div><strong>emenysFlow</strong><small>Operação em ordem</small></div></div>
  <div class="login-intro">
    <span class="eyebrow">Bem-vindo de volta</span>
    <h1>Entre para organizar o próximo evento.</h1>
    <p>Com conexão, o sistema completo. Sem conexão, checklists e layout no aparelho.</p>
  </div>
  {{if .Error}}<div class="alert danger" role="alert">{{.Error}}</div>{{end}}
  {{if .Flash}}<div class="alert info" role="status">{{.Flash}}</div>{{end}}
  <form action="/login" method="post" class="form-stack">
    <label>ID<input type="text" name="id" inputmode="numeric" pattern="[0-9]+" autocomplete="username" required autofocus></label>
    <label>Senha<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button primary full" type="submit">Entrar no sistema</button>
  </form>
</section>
{{end}}
