{{define "content"}}
{{$u := index .Users 0}}<div class="page-wrap narrow"><header class="page-header"><div><a class="back-link" href="/settings">{{icon "back"}} Voltar às configurações</a><h1>{{if .IsEdit}}Editar usuário{{else}}Novo usuário{{end}}</h1><p>Defina o acesso operacional, de organização ou administrativo.</p></div></header>{{if .Error}}<div class="alert danger">{{.Error}}</div>{{end}}<form class="form-layout" action="{{.FormAction}}" method="post"><section class="panel form-section"><div class="form-grid two"><label>Nome<input name="name" value="{{$u.Name}}" required></label><label>E-mail<input type="email" name="email" value="{{$u.Email}}" required></label><label>Perfil<select name="role"><option value="operational" {{if eq $u.Role "operational"}}selected{{end}}>Funcionário operacional</option><option value="organizer" {{if eq $u.Role "organizer"}}selected{{end}}>Organizador</option><option value="admin" {{if eq $u.Role "admin"}}selected{{end}}>Administrador</option></select></label><label>{{if .IsEdit}}Nova senha (opcional){{else}}Senha inicial{{end}}<input type="password" minlength="8" name="password" {{if not .IsEdit}}required{{end}} autocomplete="new-password"></label></div></section><div class="form-actions"><a class="button secondary" href="/settings">Cancelar</a><button class="button primary">Salvar usuário</button></div></form></div>
{{end}}
