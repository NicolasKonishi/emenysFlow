{{define "content"}}
<div class="page-wrap narrow"><header class="page-header"><div><a class="back-link" href="/catalog">← Voltar ao catálogo</a><h1>{{if .IsEdit}}Editar recipiente{{else}}Novo recipiente{{end}}</h1><p>Configure o cálculo e o talher necessário para entradas, sobremesas e bolo.</p></div></header>{{if .Error}}<div class="alert danger">{{.Error}}</div>{{end}}<form class="form-layout" action="{{.FormAction}}" method="post"><section class="panel form-section"><div class="form-grid two"><label>Nome<input name="name" value="{{.Container.Name}}" required></label><label>Capacidade em porções<input type="number" min="0" step="0.01" name="capacity_portions" value="{{if .Container.CapacityPortions.Valid}}{{inputNumber .Container.CapacityPortions.Float64}}{{end}}"></label><label>Modo de quantidade<select name="quantity_mode"><option value="per_event_type" {{if eq .Container.QuantityMode "per_event_type"}}selected{{end}}>Uma quantidade por tipo no evento</option><option value="per_menu_item" {{if eq .Container.QuantityMode "per_menu_item"}}selected{{end}}>Por item do cardápio</option><option value="fixed" {{if eq .Container.QuantityMode "fixed"}}selected{{end}}>Quantidade fixa</option><option value="manual" {{if eq .Container.QuantityMode "manual"}}selected{{end}}>Manual no evento</option><option value="per_serving" {{if eq .Container.QuantityMode "per_serving"}}selected{{end}}>Por porção</option></select></label><label>Quantidade fixa<input type="number" min="0" step="0.01" name="fixed_quantity" value="{{if .Container.FixedQuantity.Valid}}{{inputNumber .Container.FixedQuantity.Float64}}{{end}}"></label><label>Talher necessário<select name="required_utensil_type"><option value="none" {{if eq .Container.RequiredUtensilType "none"}}selected{{end}}>Nenhum</option><option value="spoon" {{if eq .Container.RequiredUtensilType "spoon"}}selected{{end}}>Colher</option><option value="fork" {{if eq .Container.RequiredUtensilType "fork"}}selected{{end}}>Garfo</option><option value="knife" {{if eq .Container.RequiredUtensilType "knife"}}selected{{end}}>Faca</option><option value="custom" {{if eq .Container.RequiredUtensilType "custom"}}selected{{end}}>Personalizado</option></select></label><label>Talher personalizado<input name="custom_utensil_name" value="{{.Container.CustomUtensilName}}"></label><label class="span-2">Item correspondente no estoque<select name="inventory_item_id"><option value="">Sem vínculo</option>{{range .Items}}<option value="{{.ID}}" {{if and $.Container.InventoryItemID.Valid (eq .ID $.Container.InventoryItemID.Int64)}}selected{{end}}>{{.Name}} — {{.InternalCode}}</option>{{end}}</select></label><label class="toggle-card"><input type="checkbox" name="disposable" {{if .Container.Disposable}}checked{{end}}><span class="toggle"></span><span><strong>Descartável</strong><small>Não será aguardado no retorno</small></span></label><label class="toggle-card"><input type="checkbox" name="requires_lid" {{if .Container.RequiresLid}}checked{{end}}><span class="toggle"></span><span><strong>Precisa de tampa</strong><small>Exibir na orientação de transporte</small></span></label><label class="toggle-card span-2"><input type="checkbox" name="is_default" {{if .Container.IsDefault}}checked{{end}}><span class="toggle"></span><span><strong>Opção padrão</strong><small>Usar como sugestão em novos pratos</small></span></label><label class="span-2">Observações de transporte<textarea name="transport_notes" rows="4">{{.Container.TransportNotes}}</textarea></label></div></section><div class="form-actions"><a class="button secondary" href="/catalog">Cancelar</a><button class="button primary">Salvar recipiente</button></div></form></div>
{{end}}
